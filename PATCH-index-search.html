<!--
  PATCH: Global Search in index.html
  Replace the IIFE block "Global Search" (≈ lines 458–625 of index.html)
  with the version below. Only SOURCES / buildIndex / extract change in
  spirit — the rest (render, keyboard nav, outside click, "/" shortcut)
  is kept identical.

  Why: the previous version fetched termux-ops.html / git-termux.html and
  parsed them with DOMParser. Those pages render their command cards at
  runtime from JSON via assets/js/scripts.js, and DOMParser does not run
  scripts, so the index was always empty. We now read the JSON directly.
-->
<script>
/* ---------------- Global Search (JSON-indexed) ---------------- */
(function () {
  const input   = document.getElementById('globalSearch');
  const results = document.getElementById('searchResults');
  if (!input || !results) return;

  const SOURCES = [
    { label: 'Termux Operations',     url: 'termux-ops.html', data: 'assets/data/commands-termux.json' },
    { label: 'Git for Termux & Acode', url: 'git-termux.html', data: 'assets/data/commands-git.json'    },
  ];

  let index = null;
  let loading = null;
  let activeIdx = -1;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function highlight(text, q) {
    const esc = escapeHtml(text);
    if (!q) return esc;
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return esc.replace(re, '<mark>$1</mark>');
  }

  // Flatten a {categories:[{commands:[...]}, ...]} JSON file into search items.
  function flatten(json, source) {
    const out = [];
    const cats = (json && json.categories) || [];
    cats.forEach(cat => {
      (cat.commands || []).forEach(cmd => {
        const command = (cmd.command || cmd.code || '').trim();
        if (!command) return;
        out.push({
          label:  source.label,
          url:    source.url,
          anchor: cmd.id ? '#cmd-' + cmd.id : '',
          cmd:    command,
          title:  (cmd.title || '').trim(),
          desc:   (cmd.description || cmd.whenToUse || '').trim().replace(/\s+/g, ' ').slice(0, 200)
        });
      });
    });
    return out;
  }

  async function buildIndex() {
    if (index) return index;
    if (loading) return loading;
    results.classList.add('open');
    results.innerHTML = '<div class="search-status">Indexing commands…</div>';
    loading = Promise.all(SOURCES.map(async src => {
      try {
        const res  = await fetch(src.data, { credentials: 'same-origin' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        return flatten(json, src);
      } catch (e) {
        console.warn('Search: failed to index', src.data, e);
        return [];
      }
    })).then(chunks => { index = chunks.flat(); return index; });
    return loading;
  }

  function render(q) {
    if (!q) { results.classList.remove('open'); results.innerHTML = ''; return; }
    if (!index) {
      results.classList.add('open');
      results.innerHTML = '<div class="search-status">Indexing commands…</div>';
      return;
    }
    const ql = q.toLowerCase();
    const matches = index.filter(it =>
         it.cmd.toLowerCase().includes(ql)
      || (it.title && it.title.toLowerCase().includes(ql))
      || (it.desc  && it.desc.toLowerCase().includes(ql))
    ).slice(0, 50);

    if (!matches.length) {
      results.classList.add('open');
      results.innerHTML = `<div class="search-status">No commands match “${escapeHtml(q)}”.</div>`;
      return;
    }

    const groups = {};
    matches.forEach(m => { (groups[m.label] ||= []).push(m); });

    let html = '';
    for (const label of Object.keys(groups)) {
      html += `<div class="search-group-title">${escapeHtml(label)} · ${groups[label].length}</div>`;
      html += groups[label].map((m, i) => `
        <a class="search-item" href="${m.url}${m.anchor}" data-idx="${i}">
          <code>${highlight(m.cmd, q)}</code>
          ${m.title ? `<div class="desc"><strong>${highlight(m.title, q)}</strong></div>` : ''}
          ${m.desc  ? `<div class="desc">${highlight(m.desc, q)}</div>` : ''}
        </a>
      `).join('');
    }
    results.classList.add('open');
    results.innerHTML = html;
    activeIdx = -1;
  }

  let debounce;
  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearTimeout(debounce);
    if (!q) { results.classList.remove('open'); return; }
    debounce = setTimeout(async () => { await buildIndex(); render(q); }, 120);
  });

  input.addEventListener('focus', () => {
    if (input.value.trim()) results.classList.add('open');
  });

  input.addEventListener('keydown', e => {
    const items = results.querySelectorAll('.search-item');
    if (!items.length) return;
    if      (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = (activeIdx + 1) % items.length; }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); activeIdx = (activeIdx - 1 + items.length) % items.length; }
    else if (e.key === 'Enter' && activeIdx >= 0) { e.preventDefault(); items[activeIdx].click(); return; }
    else if (e.key === 'Escape')    { results.classList.remove('open'); input.blur(); return; }
    else return;
    items.forEach(el => el.classList.remove('active'));
    const el = items[activeIdx];
    if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) results.classList.remove('open');
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      input.focus();
    }
  });
})();
</script>
